<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SagarBhalerao | Full stack web developer</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <div class="nav-bar">
        <div class="logo"><a href="index.html">SagarBhalerao</a></div>
        <div class="cta"><a href="index.html">Home</a></div>
    </div>
    <div class="form-container" action="" method="post" onsubmit="return validateForm()">
        <h2>Book Appointment</h2>
        <form class="form" id="form">
            <div class="name-field">
            <div class="first-name">
            <lable for="fname" class="name">First Name:</lable>
            <input type="text" name="name" id="fname" class="input-field" placeholder="First name..." required />
            <div id="fnameError" class="error"></div>
            </div>
            <div class="last-name">
            <lable for="lname" class="name">Last Name:</lable>
            <input type="text" name="name" id="lname" class="input-field" placeholder="Last name..." required/>
            <div id="lnameError" class="error"></div>
            </div>
            </div>
            <div>
            <lable for="age" class="name">Age:</lable>
            <input type="number" id="age" class="input-field" placeholder="Age must be 19 and above..." required />
            <div id="ageError" class="error"></div>
            </div>
            <div>
            <lable for="email" class="name">Email ID:</lable>
            <input type="email" name="email" id="email" class="input-field" placeholder="Your E-mail ID here..." required />
            <div id="emailError" class="error"></div>
            </div>
            <div>
            <lable for="description" class="name">Short Description:</lable>
            <textarea type="text" name="description" id="description" class="text-field" rows="5" cols="40" placeholder="Short description of your query here..." required></textarea>
            <div id="textError" class="error"></div>
            </div>
            <div class="checkbox">
            <input type="checkbox" name="consent" id="consent" class="checkbox-text" required />I consent to the collection and handling of my data as described in the <a href="index.html" target="_blank">Privacy Policy</a></div>
            <div id="checkError" class="error"></div>
            <div class="form-btn">
            <button class="cta">Submit</button>
            </div>
        </form>
    </div>
    <script src="index.js" defer></script>
</body>
